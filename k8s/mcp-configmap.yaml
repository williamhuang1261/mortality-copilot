apiVersion: v1
kind: ConfigMap
metadata:
  name: mortality-copilot-mcp-config
  labels:
    app: mortality-copilot-mcp
data:
  # The API Service's in-cluster DNS name (see k8s/service.yaml -- the
  # Service is named mortality-copilot-api, so ClusterDNS resolves it as
  # this within the same namespace). This is what makes the MCP and API
  # Deployments two genuinely separate, network-connected services rather
  # than two copies of the same code reading the same local artifacts.
  MCP_API_BASE_URL: "http://mortality-copilot-api"
  MCP_TRANSPORT: "streamable-http"
  MCP_HOST: "0.0.0.0"
  MCP_PORT: "8001"
