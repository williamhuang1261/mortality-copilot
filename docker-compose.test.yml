# A throwaway PostgreSQL instance for tests/test_db.py only. Port 55432 is
# deliberate: this machine already runs another local project's Postgres
# container on the default 5432, and this one must never collide with it
# or touch its data.
#
#   docker compose -f docker-compose.test.yml up -d
#   docker compose -f docker-compose.test.yml down -v
services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: mortality_test
      POSTGRES_PASSWORD: mortality_test
      POSTGRES_DB: mortality_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mortality_test"]
      interval: 1s
      timeout: 3s
      retries: 30
